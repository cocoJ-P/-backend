    <h1>北京市科技型企业研发创新支持专项</h1>
    <p>北京市科学技术委员会现组织申报科技型企业研发创新支持专项。企业注册地应位于北京市行政区域内，申报主体应为科技型企业。</p>
    <p>本专项对符合条件的研发项目给予资金支持，用于持续加大研发投入，推动产品验证与产业应用。</p>
    <p>申报材料包括营业执照、企业简介、项目申报书和知识产权证明。请通过指定系统完成在线申报、资格审核与专家评审。</p>
