[project]
name = "zumaix-enterprise-service"
version = "0.1.0"
description = "筑脉企服统一业务后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "beautifulsoup4>=4.15.0",
    "dateparser>=1.4.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
